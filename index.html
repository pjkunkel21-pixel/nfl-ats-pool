<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL ATS Picks Pool</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#131922; --panel-2:#1a2230; --line:#26303f;
    --ink:#e8edf4; --ink-dim:#93a1b5; --ink-faint:#64748b;
    --accent:#3ea6ff; --accent-ink:#04121f;
    --win:#2fbf71; --loss:#e5484d; --push:#d9a441;
    --radius:12px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}

  /* ---------- header ---------- */
  header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#111823,#0b0f14)}
  .head-in{max-width:1080px;margin:0 auto;padding:20px 16px 0;
           display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
  h1{font-size:22px;margin:0;letter-spacing:-.02em}
  .sub{color:var(--ink-dim);font-size:13px;margin-top:2px}
  .deadline{margin-left:auto;text-align:right;min-width:180px}
  .deadline .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint)}
  .deadline .val{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums}
  .deadline.locked .val{color:var(--push)}

  nav{display:flex;gap:4px;max-width:1080px;margin:16px auto 0;padding:0 16px}
  nav button{
    background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-dim);
    font:inherit;font-weight:600;padding:9px 14px;cursor:pointer;border-radius:6px 6px 0 0;
  }
  nav button:hover{color:var(--ink);background:#ffffff08}
  nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}

  /* ---------- generic ---------- */
  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:24px 0 16px}
  select,button.btn{
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;font:inherit;
  }
  select{cursor:pointer}
  button.btn{cursor:pointer;font-weight:600}
  button.btn:hover:not(:disabled){border-color:#3c4a5e}
  button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  .note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--push);
        border-radius:8px;padding:11px 14px;font-size:13.5px;color:var(--ink-dim);margin:14px 0}
  .note.bad{border-left-color:var(--loss)}
  .note.good{border-left-color:var(--win)}
  .muted{color:var(--ink-dim)}
  .empty{color:var(--ink-faint);padding:36px 4px;text-align:center}

  /* ---------- pick board ---------- */
  .games{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .game{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .game-hd{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;
           font-size:11px;color:var(--ink-faint);background:#ffffff05;
           text-transform:uppercase;letter-spacing:.06em}
  .side{
    display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;align-items:center;
    width:100%;background:none;border:0;border-top:1px solid var(--line);
    color:var(--ink);font:inherit;text-align:left;padding:10px 12px;cursor:pointer;
  }
  .side:first-of-type{border-top:0}
  .side:hover:not(:disabled){background:#ffffff08}
  .side:disabled{cursor:default;opacity:.55}
  .side img{width:26px;height:26px;object-fit:contain}
  .side .nm{font-weight:600}
  .side .sp{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-dim);min-width:52px;text-align:right}
  .side .sc{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-faint);min-width:26px;text-align:right}
  .side.picked{background:#3ea6ff1f;box-shadow:inset 3px 0 0 var(--accent)}
  .side.picked .nm{color:var(--accent)}
  .game.off{opacity:.5}
  .game.off .side{cursor:not-allowed}

  .picker{position:sticky;bottom:0;background:linear-gradient(180deg,#0b0f14cc,#0b0f14);
          backdrop-filter:blur(8px);border-top:1px solid var(--line);
          padding:12px 0;margin-top:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .count{font-family:var(--mono);font-size:15px}
  .count b{font-size:19px}

  /* ---------- tables ---------- */
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);
           background:#ffffff05;position:sticky;top:0}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#ffffff05}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  .rank{color:var(--ink-faint);font-family:var(--mono);width:34px}
  tr.leader td{background:#2fbf7112}
  tr.leader .rank{color:var(--win)}
  .you{color:var(--accent)}

  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;
        padding:3px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line)}
  .chip.w{border-color:#2fbf7155;background:#2fbf711a;color:#7ee2ab}
  .chip.l{border-color:#e5484d55;background:#e5484d1a;color:#ffa8ab}
  .chip.p{border-color:#d9a44155;background:#d9a4411a;color:#f0cd8a}
  .chip.hid{color:var(--ink-faint)}
  .picks-cell{display:flex;flex-wrap:wrap;gap:5px;white-space:normal}

  h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);
     margin:30px 0 10px;font-weight:600}
  footer{color:var(--ink-faint);font-size:12.5px;margin-top:40px;padding-top:16px;
         border-top:1px solid var(--line)}
  a{color:var(--accent)}
  @media (max-width:600px){
    .deadline{margin-left:0;text-align:left}
    .games{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div>
      <h1 id="poolName">NFL ATS Picks Pool</h1>
      <div class="sub" id="poolSub">Five games against the spread, Circa Sports lines.</div>
    </div>
    <div class="deadline" id="deadline">
      <div class="lbl">Picks lock in</div>
      <div class="val" id="clock">—</div>
    </div>
  </div>
  <nav role="tablist">
    <button role="tab" id="tab-pick"   aria-selected="true"  onclick="show('pick')">Make Picks</button>
    <button role="tab" id="tab-week"   aria-selected="false" onclick="show('week')">This Week</button>
    <button role="tab" id="tab-season" aria-selected="false" onclick="show('season')">Season</button>
  </nav>
</header>

<div class="wrap">
  <div id="alerts"></div>

  <!-- ======================= MAKE PICKS ======================= -->
  <section id="view-pick">
    <div class="bar">
      <label for="who" class="muted">Entrant</label>
      <select id="who"></select>
      <label for="wk" class="muted">Week</label>
      <select id="wk"></select>
    </div>
    <div id="board" class="games"></div>
    <div class="picker">
      <div class="count"><b id="cnt">0</b> <span class="muted">of</span> <b id="cntMax">5</b> <span class="muted">selected</span></div>
      <button class="btn" onclick="clearPicks()">Clear</button>
      <button class="btn primary" id="submitBtn" onclick="submitPicks()">Submit picks</button>
      <span class="muted" id="saveState"></span>
    </div>
  </section>

  <!-- ======================= THIS WEEK ======================= -->
  <section id="view-week" hidden>
    <div class="bar">
      <label for="wk2" class="muted">Week</label>
      <select id="wk2"></select>
      <button class="btn" onclick="refresh()">Refresh scores</button>
    </div>
    <div id="weekBody"></div>
  </section>

  <!-- ======================= SEASON ======================= -->
  <section id="view-season" hidden>
    <div id="seasonBody"></div>
  </section>

  <footer>
    Lines from the <a href="https://www.circasports.com/circa-million" target="_blank" rel="noopener">Circa
    Sports Million</a> weekly contest sheet. Scores from ESPN.
    Scoring follows Circa: 1 point a winner, ½ a push.
    <span id="foot-extra"></span>
  </footer>
</div>

<script>
"use strict";

/* =========================================================================
   State
   ========================================================================= */
const S = {
  cfg: null,          // data/config.json
  weeks: [],          // available weeks from data/lines/index.json
  week: null,         // week currently shown on the Make Picks tab
  lines: {},          // week -> lines file
  scores: {},         // week -> { espnId: {...} }
  remote: {},         // week -> server response for that week
  season: null,       // season-wide picks (revealed weeks only)
  sel: {},            // espnId -> 'HOME' | 'AWAY'  (current draft)
  demo: false,
  tickHandle: null,
};

const $ = (id) => document.getElementById(id);
const logo = (a) => `https://a.espncdn.com/i/teamlogos/nfl/500/${(a||'').toLowerCase()}.png`;

function fmtSpread(v){
  if (v === null || v === undefined) return '—';
  if (v === 0) return 'PK';
  return (v > 0 ? '+' : '') + v;
}

/**
 * Fetch a JSON file and say plainly which of the two things went wrong:
 * the file wasn't there, or it was there and wouldn't parse. Those have
 * completely different fixes, so they get completely different messages.
 */
async function loadJson(path, what){
  let res;
  try {
    res = await fetch(path, {cache:'no-store'});
  } catch (e) {
    alertBox(`Could not reach ${path}. If you opened this file directly, ` +
             `serve it over http instead — fetch is blocked on file:// URLs.`, 'bad');
    return null;
  }
  if (!res.ok){
    alertBox(`${path} is missing (HTTP ${res.status}). Look for ${what} at exactly ` +
             `that path in the repo — a file in the wrong folder reads as a file ` +
             `that isn't there.`, 'bad');
    return null;
  }
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch (e) {
    alertBox(`${path} loaded but isn't valid JSON — ${e.message}. ` +
             `Usually a stray comma before a } or ], a missing quote, or a ` +
             `smart quote pasted in from somewhere else.`, 'bad');
    return null;
  }
}

function alertBox(msg, kind){
  // Say a thing once. Several code paths can hit the same problem (loading a
  // week happens on boot, on a tab switch and again from the season table),
  // and three copies of one message reads like three problems.
  const box = $('alerts');
  const already = Array.prototype.find.call(
    box.children, el => el.textContent === msg);
  if (already) return already;
  const d = document.createElement('div');
  d.className = 'note' + (kind ? ' ' + kind : '');
  d.textContent = msg;
  box.appendChild(d);
  return d;
}

/* =========================================================================
   Boot
   ========================================================================= */
async function boot(){
  S.cfg = await loadJson('data/config.json', 'the pool settings');
  if (!S.cfg) return;
  document.title = S.cfg.poolName || document.title;
  $('poolName').textContent = S.cfg.poolName || 'NFL ATS Picks Pool';
  $('cntMax').textContent = S.cfg.picksPerWeek || 5;

  S.demo = !S.cfg.apiUrl;
  if (S.demo){
    alertBox('Demo mode: no Apps Script URL in data/config.json yet, so picks are ' +
             'saved only in this browser and nobody else can see them. Add apiUrl to go live.');
  }

  const idx = await loadJson('data/lines/index.json', 'the week index');
  S.weeks = idx ? (idx.weeks || []).map(w => w.week) : [];
  if (!S.weeks.length){
    alertBox('No weeks in data/lines/. Run scripts/fetch_lines.py (or use admin.html).', 'bad');
    return;
  }

  const opts = S.weeks.map(w => `<option value="${w}">Week ${w}</option>`).join('');
  $('wk').innerHTML = opts; $('wk2').innerHTML = opts;
  const latest = Math.max.apply(null, S.weeks);
  $('wk').value = latest; $('wk2').value = latest;
  S.week = latest;

  $('who').innerHTML = '<option value="">Who are you?</option>' +
    (S.cfg.entrants || []).map(n => `<option>${esc(n)}</option>`).join('');
  try { const w = localStorage.getItem('ats-who'); if (w) $('who').value = w; } catch(e){}

  $('wk').onchange  = () => { S.week = +$('wk').value; S.sel = {}; loadWeek(S.week).then(renderPick); };
  $('wk2').onchange = () => loadWeek(+$('wk2').value).then(renderWeek);
  $('who').onchange = () => {
    try { localStorage.setItem('ats-who', $('who').value); } catch(e){}
    S.sel = {}; loadWeek(S.week).then(renderPick);
  };

  await loadWeek(S.week);
  renderPick();
  startClock();
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================================
   Data loading
   ========================================================================= */
async function loadWeek(week){
  if (!S.lines[week]){
    const d = await loadJson(`data/lines/week-${week}.json`, `week ${week}'s lines`);
    if (!d){ dropWeek(week); return; }
    S.lines[week] = d;
  }
  await Promise.all([loadScores(week), loadRemote(week)]);
}

async function loadScores(week){
  const season = (S.lines[week] && S.lines[week].season) || S.cfg.season;
  try {
    const url = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard' +
                `?dates=${season}&seasontype=2&week=${week}`;
    const d = await (await fetch(url, {cache:'no-store'})).json();
    const m = {};
    (d.events || []).forEach(ev => {
      const c = (ev.competitions || [])[0] || {};
      const st = (ev.status || {}).type || {};
      let home = null, away = null;
      (c.competitors || []).forEach(x => {
        const o = { abbr:(x.team||{}).abbreviation, score: x.score === '' ? null : Number(x.score) };
        if (x.homeAway === 'home') home = o; else away = o;
      });
      m[String(ev.id)] = {
        home, away,
        started: !!st.state && st.state !== 'pre',
        final: !!st.completed,
        detail: st.shortDetail || '',
        kickoff: ev.date,
      };
    });
    S.scores[week] = m;
  } catch (e) { S.scores[week] = S.scores[week] || {}; }
}

async function loadRemote(week){
  if (S.demo){
    const season = S.cfg.season;
    const all = readLocal();
    const mine = (all[key(season, week)] || {});
    const who = $('who').value;
    const lockAt = localLock(week);
    const locked = Date.now() >= lockAt;
    const picks = [];
    Object.keys(mine).forEach(entrant => {
      if (!locked && entrant !== who) return;
      mine[entrant].forEach(p => picks.push(Object.assign({entrant}, p)));
    });
    S.remote[week] = { ok:true, season, week, lockAt, locked,
                       serverTime: Date.now(), submitted: Object.keys(mine).sort(), picks };
    return;
  }
  const season = (S.lines[week] && S.lines[week].season) || S.cfg.season;
  const who = encodeURIComponent($('who').value || '');
  try {
    const url = `${S.cfg.apiUrl}?action=picks&season=${season}&week=${week}&who=${who}`;
    const r = await (await fetch(url, {cache:'no-store'})).json();
    if (!r.ok) throw new Error(r.error || 'server error');
    S.remote[week] = r;
  } catch (e) {
    S.remote[week] = { ok:false, error:String(e.message||e), picks:[], submitted:[],
                       lockAt: localLock(week), locked: Date.now() >= localLock(week) };
  }
}

/* Fallback deadline when the server can't be reached: Saturday 4pm PT before
   the week's first Sunday game. */
function localLock(week){
  const games = ((S.lines[week] || {}).games) || [];
  const times = games.map(g => Date.parse(g.kickoff)).filter(t => !isNaN(t)).sort((a,b)=>a-b);
  if (!times.length) return Infinity;
  let anchor = times[times.length-1];
  for (const t of times){
    if (new Date(t).toLocaleDateString('en-US',{timeZone:'America/Los_Angeles',weekday:'short'}) === 'Sun'){
      anchor = t; break;
    }
  }
  const d = new Date(anchor);
  for (let i=0;i<10;i++){
    const wd = new Date(d).toLocaleDateString('en-US',{timeZone:'America/Los_Angeles',weekday:'short'});
    if (wd === 'Sat') break;
    d.setTime(d.getTime() - 86400000);
  }
  const ymd = new Date(d).toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
  // Pacific is UTC-7 in season (Sept-Oct), UTC-8 after the November change.
  const probe = new Date(`${ymd}T20:00:00Z`);
  const off = probe.toLocaleString('en-US',{timeZone:'America/Los_Angeles',timeZoneName:'shortOffset'});
  const m = /GMT([+-]\d+)/.exec(off);
  const hrs = m ? Number(m[1]) : -8;
  const sign = hrs < 0 ? '-' : '+';
  const pad = String(Math.abs(hrs)).padStart(2,'0');
  return Date.parse(`${ymd}T16:00:00${sign}${pad}:00`);
}

/**
 * A week the index advertises but that has no file behind it -- usually a week
 * deleted from data/lines/ before the index caught up. Take it out of the
 * pickers so nobody can steer back into it.
 */
function dropWeek(week){
  S.weeks = S.weeks.filter(w => w !== week);
  const opts = S.weeks.map(w => `<option value="${w}">Week ${w}</option>`).join('');
  ['wk','wk2'].forEach(id => {
    const sel = $(id), prev = +sel.value;
    sel.innerHTML = opts;
    if (S.weeks.includes(prev)) sel.value = prev;
    else if (S.weeks.length) sel.value = Math.max.apply(null, S.weeks);
  });
  if (S.week === week && S.weeks.length){
    S.week = Math.max.apply(null, S.weeks);
    $('wk').value = S.week;
    loadWeek(S.week).then(renderPick);
  }
}

const key = (s,w) => `${s}-${w}`;
function readLocal(){
  try { return JSON.parse(localStorage.getItem('ats-demo') || '{}'); } catch(e){ return {}; }
}
function writeLocal(o){
  try { localStorage.setItem('ats-demo', JSON.stringify(o)); } catch(e){}
}

/* =========================================================================
   Grading
   ========================================================================= */
/** > 0 the home team covered, < 0 the away team covered, 0 exactly is a push. */
function coverMargin(game, sc){
  if (!sc || !sc.final || game.spread === null || game.spread === undefined) return null;
  if (sc.home.score === null || sc.away.score === null) return null;
  return (sc.home.score - sc.away.score) + game.spread;
}

function gradePick(pick, game, sc){
  const m = coverMargin(game, sc);
  if (m === null) return null;                       // not final yet
  if (Math.abs(m) < 1e-9) return 'push';
  const homeCovered = m > 0;
  return (pick.side === 'HOME') === homeCovered ? 'win' : 'loss';
}

function pointsFor(result){
  const sc = (S.cfg && S.cfg.scoring) || {win:1, push:0.5, loss:0};
  if (result === 'win') return sc.win;
  if (result === 'push') return sc.push;
  if (result === 'loss') return sc.loss;
  return 0;
}

/* =========================================================================
   Tabs
   ========================================================================= */
function show(name){
  ['pick','week','season'].forEach(n => {
    $('view-' + n).hidden = (n !== name);
    $('tab-' + n).setAttribute('aria-selected', String(n === name));
  });
  if (name === 'week')   loadWeek(+$('wk2').value).then(renderWeek);
  if (name === 'season') renderSeason();
}

async function refresh(){
  const w = +$('wk2').value;
  await loadScores(w); await loadRemote(w);
  renderWeek();
}

/* =========================================================================
   Make Picks
   ========================================================================= */
function renderPick(){
  const week = S.week;
  const L = S.lines[week] || {games:[]};
  const R = S.remote[week] || {};
  const sc = S.scores[week] || {};
  const who = $('who').value;
  const max = S.cfg.picksPerWeek || 5;

  // Seed the draft from whatever this entrant already submitted.
  if (who && !Object.keys(S.sel).length){
    (R.picks || []).filter(p => p.entrant === who)
                   .forEach(p => { S.sel[p.espnId] = p.side; });
  }

  const missing = L.games.filter(g => g.spread === null || g.spread === undefined).length;
  const unsure  = L.games.filter(g => g.status === 'unverified' || g.status === 'conflict').length;
  const book    = L.games.filter(g => g.status === 'book').length;
  $('alerts').querySelectorAll('.note.lines').forEach(n => n.remove());
  if (missing || unsure || book){
    const n = alertBox(
      [book    ? `These are sportsbook lines standing in until Circa posts its ` +
                 `Week ${week} sheet (Thursday, about 10am PT).` : '',
       missing ? `${missing} game${missing>1?'s have':' has'} no Circa line yet, so ` +
                 `${missing>1?'they are':'it is'} not pickable.` : '',
       unsure  ? `${unsure} line${unsure>1?'s were':' was'} read from the PDF with less ` +
                 `confidence — worth an eyeball in admin.html.` : ''
      ].filter(Boolean).join(' '));
    n.classList.add('lines');
  }

  const locked = !!R.locked;
  const now = Date.now();

  $('board').innerHTML = L.games.map(g => {
    const s = sc[g.espnId];
    const kicked = s ? s.started : (Date.parse(g.kickoff) <= now);
    const usable = g.spread !== null && g.spread !== undefined && !kicked && !locked && !!who;
    const homeSp = g.spread, awaySp = (g.spread === null ? null : -g.spread);
    const when = new Date(g.kickoff).toLocaleString([], {
      weekday:'short', hour:'numeric', minute:'2-digit'});
    const row = (side, abbr, sp) => {
      const picked = S.sel[g.espnId] === side;
      // ESPN reports 0-0 before kickoff; only show a score once it means something.
      const score = (s && s.started && s[side.toLowerCase()])
        ? s[side.toLowerCase()].score : null;
      return `<button class="side${picked?' picked':''}" ${usable?'':'disabled'}
        onclick="pick('${g.espnId}','${side}')">
        <img src="${logo(abbr)}" alt="" loading="lazy">
        <span class="nm">${abbr}</span>
        <span class="sc">${score === null || score === undefined ? '' : score}</span>
        <span class="sp">${fmtSpread(sp)}</span></button>`;
    };
    return `<div class="game${usable?'':' off'}">
      <div class="game-hd"><span>${when}</span><span>${
        s && s.final ? 'Final' : (s && s.started ? esc(s.detail) : '')}</span></div>
      ${row('AWAY', g.away, awaySp)}
      ${row('HOME', g.home, homeSp)}
    </div>`;
  }).join('');

  updateCount();
  $('submitBtn').disabled = locked || !who;
  $('saveState').textContent = !who ? 'Pick your name to start.'
    : locked ? 'This week is locked.'
    : (R.picks || []).some(p => p.entrant === who) ? 'Your picks are in — resubmit to change them.' : '';
}

function pick(id, side){
  const max = S.cfg.picksPerWeek || 5;
  if (S.sel[id] === side) delete S.sel[id];
  else {
    if (!S.sel[id] && Object.keys(S.sel).length >= max) {
      flash(`That's already ${max} games — drop one first.`);
      return;
    }
    S.sel[id] = side;
  }
  renderPick();
}

function clearPicks(){ S.sel = {}; renderPick(); }

function updateCount(){
  const n = Object.keys(S.sel).length;
  $('cnt').textContent = n;
  $('cnt').style.color = n === (S.cfg.picksPerWeek||5) ? 'var(--win)' : '';
}

let flashTimer = null;
function flash(msg){
  $('saveState').textContent = msg;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { $('saveState').textContent = ''; }, 3000);
}

async function submitPicks(){
  const who = $('who').value;
  const week = S.week;
  const L = S.lines[week];
  const max = S.cfg.picksPerWeek || 5;
  const ids = Object.keys(S.sel);
  if (!who) return flash('Pick your name first.');
  if (ids.length !== max) return flash(`Take exactly ${max} games.`);

  const picks = ids.map(id => {
    const g = L.games.find(x => String(x.espnId) === String(id));
    const side = S.sel[id];
    return { espnId:String(id), side,
             team: side === 'HOME' ? g.home : g.away,
             spread: side === 'HOME' ? g.spread : -g.spread };
  });

  $('submitBtn').disabled = true;
  $('saveState').textContent = 'Saving…';

  if (S.demo){
    const all = readLocal();
    const k = key(S.cfg.season, week);
    all[k] = all[k] || {};
    all[k][who] = picks;
    writeLocal(all);
    await loadRemote(week);
    renderPick();
    $('submitBtn').disabled = false;
    return flash('Saved in this browser (demo mode).');
  }

  try {
    const res = await fetch(S.cfg.apiUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},  // keeps it a simple request
      body: JSON.stringify({ action:'submit', season:(L.season||S.cfg.season),
                             week, entrant:who, picks })
    });
    const r = await res.json();
    if (!r.ok) throw new Error(r.error || 'rejected');
    await loadRemote(week);
    renderPick();
    flash('Picks are in.');
  } catch (e) {
    flash('Could not save: ' + (e.message || e));
  } finally {
    $('submitBtn').disabled = false;
  }
}

/* =========================================================================
   This Week
   ========================================================================= */
function renderWeek(){
  const week = +$('wk2').value;
  const L = S.lines[week] || {games:[]};
  const R = S.remote[week] || {picks:[], submitted:[]};
  const sc = S.scores[week] || {};
  const who = $('who').value;
  const byId = {}; L.games.forEach(g => byId[String(g.espnId)] = g);

  const entrants = (S.cfg.entrants || []).slice();
  (R.submitted || []).forEach(n => { if (!entrants.includes(n)) entrants.push(n); });

  const rows = entrants.map(name => {
    const mine = (R.picks || []).filter(p => p.entrant === name);
    let pts = 0, w = 0, l = 0, p_ = 0, done = 0;
    const chips = mine.map(pk => {
      const g = byId[String(pk.espnId)];
      if (!g) return '';
      const res = gradePick(pk, g, sc[pk.espnId]);
      if (res){ done++; pts += pointsFor(res);
                if (res==='win') w++; else if (res==='loss') l++; else p_++; }
      const cls = res === 'win' ? 'w' : res === 'loss' ? 'l' : res === 'push' ? 'p' : '';
      const sp = fmtSpread(pk.spread);
      return `<span class="chip ${cls}">${esc(pk.team)} ${sp}</span>`;
    }).join('');

    const submitted = (R.submitted || []).includes(name);
    const hidden = !R.locked && !mine.length && submitted;
    return { name, pts, w, l, p_, done, submitted,
      cells: hidden
        ? `<span class="chip hid">${S.cfg.picksPerWeek||5} picks in — hidden until the deadline</span>`
        : (chips || (submitted ? '' : `<span class="muted">no picks</span>`)) };
  });

  const anyDone = rows.some(r => r.done > 0);
  rows.sort((a,b) => b.pts - a.pts || b.w - a.w || a.name.localeCompare(b.name));
  const top = rows.length && rows[0].pts > 0 ? rows[0].pts : null;

  const lockLine = R.locked
    ? 'Picks are revealed.'
    : `Everyone's picks stay hidden until the deadline. ${(R.submitted||[]).length} of ${entrants.length} in.`;

  $('weekBody').innerHTML = `
    <div class="note ${R.locked ? 'good' : ''}">${lockLine}</div>
    <div class="scroll"><table id="entrantTable">
      <thead><tr>
        <th class="rank"></th><th>Entrant</th><th>Picks</th>
        <th class="num">W-L-P</th><th class="num">Pts</th>
      </tr></thead>
      <tbody>${rows.map((r,i) => `
        <tr class="${anyDone && top !== null && r.pts === top ? 'leader' : ''}">
          <td class="rank">${anyDone ? i+1 : ''}</td>
          <td class="${r.name === who ? 'you' : ''}">${esc(r.name)}</td>
          <td><div class="picks-cell">${r.cells}</div></td>
          <td class="num">${r.done ? `${r.w}-${r.l}-${r.p_}` : '—'}</td>
          <td class="num">${r.done ? r.pts : '—'}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>

    <h2>Week ${week} lines &amp; results</h2>
    <div class="scroll"><table id="gameTable">
      <thead><tr><th>Game</th><th class="num">Line</th><th class="num">Score</th>
        <th>Covered</th><th>Status</th></tr></thead>
      <tbody>${L.games.map(g => {
        const s = sc[g.espnId];
        const m = coverMargin(g, s);
        const cov = m === null ? '—'
          : Math.abs(m) < 1e-9 ? '<span class="chip p">push</span>'
          : `<span class="chip w">${esc(m > 0 ? g.home : g.away)}</span>`;
        return `<tr>
          <td>${esc(g.away)} @ ${esc(g.home)}</td>
          <td class="num">${esc(g.home)} ${fmtSpread(g.spread)}</td>
          <td class="num">${s && s.away.score !== null ? `${s.away.score}–${s.home.score}` : '—'}</td>
          <td>${cov}</td>
          <td class="muted">${s ? esc(s.detail) : ''}${
            g.status && g.status !== 'verified' ? ` <span class="chip">${esc(g.status)}</span>` : ''}</td>
        </tr>`;}).join('')}
      </tbody>
    </table></div>`;
}

/* =========================================================================
   Season
   ========================================================================= */
async function renderSeason(){
  $('seasonBody').innerHTML = '<div class="empty">Loading…</div>';
  const season = S.cfg.season;

  if (!S.season){
    if (S.demo){
      const all = readLocal(); const weeks = {};
      Object.keys(all).forEach(k => {
        const [s, w] = k.split('-').map(Number);
        if (s !== season || Date.now() < localLock(w)) return;
        weeks[w] = [];
        Object.keys(all[k]).forEach(entrant =>
          all[k][entrant].forEach(p => weeks[w].push(Object.assign({entrant}, p))));
      });
      S.season = { ok:true, weeks };
    } else {
      try {
        S.season = await (await fetch(`${S.cfg.apiUrl}?action=season&season=${season}`,
                                      {cache:'no-store'})).json();
      } catch (e) { S.season = { ok:false, weeks:{} }; }
    }
  }

  const weeks = Object.keys(S.season.weeks || {}).map(Number).sort((a,b)=>a-b);
  if (!weeks.length){
    $('seasonBody').innerHTML =
      '<div class="empty">Nothing to show yet — the season table fills in once a week’s deadline passes.</div>';
    return;
  }

  // Everything the season needs: lines + scores for each revealed week.
  await Promise.all(weeks.map(async w => { await loadWeek(w); }));

  const entrants = {};
  const perWeek = {};      // week -> { entrant -> pts }
  weeks.forEach(w => {
    const L = S.lines[w] || {games:[]};
    const sc = S.scores[w] || {};
    const byId = {}; L.games.forEach(g => byId[String(g.espnId)] = g);
    perWeek[w] = {};
    (S.season.weeks[w] || []).forEach(pk => {
      const g = byId[String(pk.espnId)];
      if (!g) return;
      const res = gradePick(pk, g, sc[pk.espnId]);
      if (!res) return;
      entrants[pk.entrant] = true;
      const e = perWeek[w][pk.entrant] = perWeek[w][pk.entrant] || {pts:0,w:0,l:0,p:0};
      e.pts += pointsFor(res);
      if (res === 'win') e.w++; else if (res === 'loss') e.l++; else e.p++;
    });
  });

  // Weekly winners (ties share the week).
  const weekWins = {};
  weeks.forEach(w => {
    const vals = Object.values(perWeek[w]).map(v => v.pts);
    if (!vals.length) return;
    const best = Math.max.apply(null, vals);
    if (best <= 0) return;
    Object.keys(perWeek[w]).forEach(n => {
      if (perWeek[w][n].pts === best) weekWins[n] = (weekWins[n] || 0) + 1;
    });
  });

  const names = Object.keys(entrants).sort();
  const totals = names.map(n => {
    let pts=0,w=0,l=0,p=0;
    weeks.forEach(k => { const e = perWeek[k][n]; if (e){ pts+=e.pts; w+=e.w; l+=e.l; p+=e.p; } });
    return { name:n, pts, w, l, p, wins: weekWins[n] || 0 };
  }).sort((a,b) => b.pts - a.pts || b.wins - a.wins || a.name.localeCompare(b.name));

  const who = $('who').value;
  const top = totals.length ? totals[0].pts : 0;

  $('seasonBody').innerHTML = `
    <h2>Season standings</h2>
    <div class="scroll"><table>
      <thead><tr>
        <th class="rank"></th><th>Entrant</th>
        <th class="num">Pts</th><th class="num">W-L-P</th>
        <th class="num">Win %</th><th class="num">Weeks won</th>
        ${weeks.map(w => `<th class="num">W${w}</th>`).join('')}
      </tr></thead>
      <tbody>${totals.map((t,i) => {
        const graded = t.w + t.l + t.p;
        const pct = graded ? ((t.pts / graded) * 100).toFixed(0) + '%' : '—';
        return `<tr class="${t.pts === top && top > 0 ? 'leader' : ''}">
          <td class="rank">${i+1}</td>
          <td class="${t.name === who ? 'you' : ''}">${esc(t.name)}</td>
          <td class="num"><b>${t.pts}</b></td>
          <td class="num">${t.w}-${t.l}-${t.p}</td>
          <td class="num">${pct}</td>
          <td class="num">${t.wins || ''}</td>
          ${weeks.map(w => {
            const e = perWeek[w][t.name];
            return `<td class="num muted">${e ? e.pts : '—'}</td>`;
          }).join('')}
        </tr>`;}).join('')}
      </tbody>
    </table></div>
    <p class="muted" style="font-size:13px">
      Weeks appear here once their deadline has passed. “Weeks won” counts every
      week an entrant had the outright or tied-best score.</p>`;
}

/* =========================================================================
   Deadline clock
   ========================================================================= */
function startClock(){
  const tick = () => {
    const R = S.remote[S.week] || {};
    const lockAt = R.lockAt || localLock(S.week);
    const box = $('deadline');
    if (!lockAt || lockAt === Infinity){ $('clock').textContent = '—'; return; }
    const left = lockAt - Date.now();
    if (left <= 0){
      box.classList.add('locked');
      box.querySelector('.lbl').textContent = 'Locked';
      $('clock').textContent = new Date(lockAt).toLocaleDateString([], {month:'short', day:'numeric'});
      return;
    }
    box.classList.remove('locked');
    box.querySelector('.lbl').textContent = 'Picks lock in';
    const d = Math.floor(left/86400000), h = Math.floor(left/3600000)%24,
          m = Math.floor(left/60000)%60, s = Math.floor(left/1000)%60;
    $('clock').textContent = d > 0 ? `${d}d ${h}h ${String(m).padStart(2,'0')}m`
                                   : `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  };
  tick();
  clearInterval(S.tickHandle);
  S.tickHandle = setInterval(tick, 1000);
}

boot();
</script>
